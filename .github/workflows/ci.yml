name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# One run per branch: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgeos-dev libproj-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit check --update

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgeos-dev libproj-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-24.04

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: hikers
          POSTGRES_PASSWORD: hikers_dev
          POSTGRES_DB: hikers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikers -d hikers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgeos-dev libproj-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails test

  # Publishes the image the server runs (deploy/update.sh pulls it). Only after every check passes,
  # and only from main.
  publish_image:
    needs: [ scan_ruby, lint, test ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
